{% if product_data %}
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Product Price</th>
            </tr>
        </thead>
        <tbody>
            {% for product_record in product_data %}
                <tr>
                    <td>{{ product_record.name }}</td>
                    <td>PHP {{ product_record.price }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
